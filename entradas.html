<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HUAN62 - Generar Ticket</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #050509; --card: #10101e; --accent: #00f2fe; --border: #1f1f33; --text: #ffffff; --input-bg: #080812;
    }

    body {
      font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--text);
      margin: 0; display: flex; justify-content: center; padding-top: 20px; padding-bottom: 40px;
    }

    .container {
      width: 92%; max-width: 400px; background: var(--card); padding: 25px;
      border-radius: 30px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .subtitle { text-align: center; color: #666; font-size: 10px; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase; }
    .step { display: none; animation: fadeIn 0.4s ease; }
    .active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    label { display: block; font-size: 10px; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

    input, select {
      width: 100%; padding: 16px; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 15px; color: white; font-size: 15px; box-sizing: border-box; margin-bottom: 15px; outline: none;
      appearance: none; -webkit-appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;utf8,<svg fill='%200f2fe' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 20px;
      cursor: pointer;
    }

    select option { background: var(--card); color: white; }
    input:focus, select:focus { border-color: var(--accent); }

    .btn-main {
      width: 100%; padding: 18px; background: linear-gradient(135deg, #007aff, var(--accent));
      border: none; border-radius: 16px; color: #000; font-weight: 800; font-size: 15px; cursor: pointer; text-transform: uppercase;
      transition: transform 0.1s ease;
    }

    .btn-main:active { transform: scale(0.98); }

    .btn-back { 
      display: block; width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.03); 
      border: 1px solid #444; border-radius: 16px; color: #888; font-size: 12px; font-weight: 700; 
      text-transform: uppercase; margin-top: 15px; cursor: pointer; text-align: center;
    }

    /* Contenedor principal del Ticket */
    .ticket-visual { 
      position: relative; 
      overflow: hidden; 
      background-color: #000; /* Color de respaldo por si no carga la imagen */
      border-radius: 20px; 
      padding: 20px; 
      text-align: center; 
      margin-bottom: 20px; 
    }

    /* Imagen de fondo corregida con opacidad alta para lucir la portada */
    .ticket-visual::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('assets/huan62.png'); /* Reemplaza o verifica tu ruta */
      background-size: cover;
      background-position: center;
      opacity: 0.40; 
      z-index: 0;
    }

    /* Estructura de 2 columnas con el QR centrado verticalmente */
    .ticket-grid {
      display: flex;
      gap: 15px;
      align-items: center; /* Centra verticalmente el QR respecto a los datos */
      position: relative;
      z-index: 1;
      margin-top: 15px; /* Espacio añadido entre el título y los datos */
    }

    .ticket-col-left {
      flex: 0 0 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ticket-col-right {
      flex: 1;
      text-align: left;
    }

    #qrcode { background: white; padding: 6px; border-radius: 10px; display: inline-block; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    #qrcode img, #qrcode canvas { width: 105px !important; height: 105px !important; display: block; }

    .ticket-data { width: 100%; }
    .data-item { margin-bottom: 10px; }
    .data-label { font-size: 8px; color: #ccc; display: block; text-shadow: 1px 1px 2px #000; }
    .data-value { font-size: 13px; font-weight: bold; text-transform: uppercase; color: #fff; text-shadow: 1px 1px 2px #000; }

    .logo-fest-container { width: 100%; max-width: 200px; margin: 0 auto 10px; display: flex; justify-content: center; }
    .logo-fest-container img { width: 100%; }
  </style>
</head>
<body>

<div class="container">
    <div class="logo-fest-container">
        <img src="assets/logo1.png" alt="Logo">
    </div>
    <div class="subtitle" id="promotor-tag">PROMOTOR: CARGANDO...</div>

    <!-- PASO 1: Formulario Único Directo -->
    <div id="step-1" class="step active">
       <label>Tipo de Entrada</label>
        <select id="select-tipo" onchange="actualizarMontoAuto()">
            <option value="" data-precio="">-- Selecciona una opción --</option>
            <optgroup label="🎟️ Entradas Oficiales">
                <option value="GENERAL" data-precio="30">GENERAL</option>
                <option value="VIP" data-precio="60">VIP</option>
            </optgroup>
            <optgroup label="🍾 Boxes VIP">
                <option value="Box Gold" data-precio="1800">Box Gold - S/ 1,800</option>
                <option value="Box Platinum" data-precio="2200">Box Platinum - S/ 2,200</option>
            </optgroup>
        </select>

        <label>Monto a Cobrar (S/)</label>
        <input type="number" id="monto-entrada" placeholder="Monto" step="0.01" min="0" inputmode="decimal">

        <label>Nombre del Cliente</label>
        <input type="text" id="nombre-cliente" placeholder="Nombre completo">

        <label>WhatsApp (9 dígitos)</label>
        <input type="tel" id="whatsapp-cliente" placeholder="Ej. 987654321" maxlength="9" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '');">

        <button class="btn-main" onclick="generarVenta()">Generar Ticket</button>
    </div>

    <!-- PASO 2: Resultado del Ticket Visual -->
    <div id="step-2" class="step">
        <div class="ticket-visual" id="ticket-area-pdf">

            <!-- Cabecera del ticket -->
            <div style="position: relative; z-index: 1; text-align: center;">
                <div style="display: flex; justify-content: center; margin-bottom: 4px;">
                    <img src="assets/logo1.png" alt="Logo Bloom" style="width: 50px; height: auto; opacity: 0.9; mix-blend-mode: screen;">
                </div>
                <h2 style="margin: 0; text-shadow: 2px 2px 4px #000; font-size: 14px;">¡HUAN62 EN TRUJILLO!</h2>
            </div>

            <!-- Estructura de 2 Columnas con espacio superior y QR centrado verticalmente -->
            <div class="ticket-grid">
                <!-- Columna Izquierda: QR -->
                <div class="ticket-col-left">
                    <div id="qrcode"></div>
                    <span style="font-size: 8px; color: #fff; margin-top: 6px; text-shadow: 1px 1px 2px #000; text-align: center; font-weight: bold;">ESCANÉAME</span>
                </div>

                <!-- Columna Derecha: Datos -->
                <div class="ticket-col-right">
                    <div class="ticket-data">
                        <div class="data-item">
                            <span class="data-label">CLIENTE</span>
                            <span id="res-nombre" class="data-value">-</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">TIPO DE ENTRADA</span>
                            <span id="res-tipo" class="data-value" style="color: var(--accent);">-</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">PROMOTOR OFICIAL</span>
                            <span id="res-promotor" class="data-value" style="color: var(--accent);">-</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">LUGAR DEL EVENTO</span>
                            <span class="data-value">FAMA CLUB</span>
                        </div>
                        <div class="data-item">
                            <span class="data-label">FECHA DEL EVENTO</span>
                            <span class="data-value">16 DE OCTUBRE</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Términos y condiciones -->
            <div style="position: relative; z-index: 1; margin-top: 15px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.2); font-size: 9px; color: #ddd; text-align: justify; line-height: 1.2; text-shadow: 1px 1px 2px #000;">
                <b>TÉRMINOS:</b> Personal e intransferible. Válido para un solo ingreso.
            </div>

            <p style="position: relative; z-index: 1; font-size: 8px; color: #ccc; margin: 5px 0 0 0; text-align: center; text-shadow: 1px 1px 2px #000;">
                © 2026 BloomExperience. Todos los derechos reservados.
            </p>
        </div>
            
        <button class="btn-main" style="background: #fff; color: #000; margin-top: 15px; margin-bottom: 8px;" onclick="enviarTicketWhatsApp()">COMPARTIR TICKET</button>
        <button class="btn-back" onclick="window.location.reload()">+ Nueva Venta</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://nakrilawyrppxvjnrbks.supabase.co/'; 
    const SUPABASE_KEY = 'sb_publishable_JJGnQbTeKrQ8m02e76pZpg_nJ9lGp0m';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datosTicket = null;
    const promotorLogueado = localStorage.getItem('promotor_activo') || "Invitado";

    function irAPaso(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        const el = document.getElementById('step-' + n);
        if (el) el.classList.add('active');
    }

    function actualizarMontoAuto() {
        const select = document.getElementById('select-tipo');
        const opcionSeleccionada = select.options[select.selectedIndex];
        const precio = opcionSeleccionada.getAttribute('data-precio');
        
        if (precio) {
            document.getElementById('monto-entrada').value = precio;
        } else {
            document.getElementById('monto-entrada').value = '';
        }
    }

    async function generarVenta() {
        const tipoInput = document.getElementById('select-tipo').value;
        const nombreInput = document.getElementById('nombre-cliente').value.trim().toUpperCase();
        const whatsappInput = document.getElementById('whatsapp-cliente').value.trim();
        const montoInput = parseFloat(document.getElementById('monto-entrada').value);

        if (!tipoInput) {
            alert("Por favor, selecciona el tipo de entrada.");
            return;
        }

        if (isNaN(montoInput) || montoInput < 0) {
            alert("Por favor, ingresa un monto válido (puede ser 0 para cortesías).");
            return;
        }

        if (!nombreInput) {
            alert("Por favor, ingresa el nombre del cliente.");
            return;
        }

        if (whatsappInput.length !== 9 || isNaN(whatsappInput)) {
            alert("El número de WhatsApp debe tener exactamente 9 dígitos.");
            return;
        }

        const codigoNuevo = `NP-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).substr(2, 5).toUpperCase()}`;
        const fechaISO = new Date().toISOString();

        const objetoVenta = {
            codigo_qr: codigoNuevo,
            nombre_cliente: nombreInput,
            whatsapp: "51" + whatsappInput,
            tipo_entrada: tipoInput,
            precio: montoInput,
            promotor: promotorLogueado,
            fecha_venta: fechaISO,
            usado: false
        };

        try {
            const { error } = await _supabase.from('tickets').insert([objetoVenta]);
            if (error) throw error;

            datosTicket = { 
                nombre: nombreInput, 
                codigo: codigoNuevo, 
                whatsapp: "51" + whatsappInput, 
                monto: montoInput.toFixed(2)
            };

            document.getElementById('res-nombre').innerText = nombreInput;
            document.getElementById('res-tipo').innerText = tipoInput.toUpperCase();
            document.getElementById('res-promotor').innerText = promotorLogueado.toUpperCase();

            irAPaso(2);

            setTimeout(() => {
                const qrContainer = document.getElementById("qrcode");
                if (qrContainer) {
                    qrContainer.innerHTML = "";
                    new QRCode(qrContainer, { text: codigoNuevo, width: 105, height: 105, correctLevel: QRCode.CorrectLevel.H });
                }
            }, 200);

        } catch (error) {
            alert("Error al registrar venta: " + error.message);
        }
    }

    async function enviarTicketWhatsApp() {
        const { jsPDF } = window.jspdf;
        const elementoTicket = document.getElementById('ticket-area-pdf');

        const qrCanvas = document.querySelector('#qrcode canvas');
        const qrImg = document.querySelector('#qrcode img');

        if (!elementoTicket || !datosTicket) return alert("Error: Datos insuficientes");

        try {
            let qrListo = false;
            let intentos = 0;

            while (!qrListo && intentos < 10) {
                if ((qrCanvas && qrCanvas.width > 0) || (qrImg && qrImg.src.length > 100)) {
                    qrListo = true;
                } else {
                    await new Promise(r => setTimeout(r, 200));
                    intentos++;
                }
            }

            if (qrCanvas && qrListo && qrImg) {
                qrImg.src = qrCanvas.toDataURL("image/png");
                qrImg.style.display = "inline-block";
                qrCanvas.style.display = "none";
            }

            await new Promise(r => setTimeout(r, 300));

            const canvas = await html2canvas(elementoTicket, {
                scale: 3, 
                backgroundColor: "#000000",
                useCORS: true,
                logging: false
            });

            const imgData = canvas.toDataURL('image/png');

            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'px',
                format: [canvas.width / 3, canvas.height / 3]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, canvas.width / 3, canvas.height / 3);

            const nombreArchivo = `TICKET_${datosTicket.nombre.replace(/\s+/g, '_')}.pdf`;
            pdf.save(nombreArchivo);

        } catch (err) {
            console.error("Error crítico:", err);
            alert("Hubo un error al generar la imagen. Inténtalo nuevamente.");
        }
    }

    window.onload = () => {
        document.getElementById('promotor-tag').innerText = "PROMOTOR: " + promotorLogueado.toUpperCase();
    };
</script>
</body>
</html>
